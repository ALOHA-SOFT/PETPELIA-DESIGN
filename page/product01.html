<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>고양이 모래</title>
  <!-- 썸네일 이미지 설정 -->
  <link rel="icon" type="image/png" href="../img/favicon.png" />
  <meta property="og:image" content="../img/og.png">              
  <!-- 웹 페이지 설명 (선택 사항) -->
  <meta name="description" content="펫펠리아">         
  <meta property="og:site_name" content="펫펠리아">
  <meta property="og:description" content="펫펠리아">  
  <!-- 웹 페이지 URL -->
  <meta property="og:url" content="http://petpelia.com">
  <!-- 웹 페이지 제목 -->
  <meta property="og:title" content="펫펠리아">        
  <!-- 웹 페이지 타입 (웹사이트, 기사, 제품 등) -->
  <meta property="og:type" content="website">         
  <!-- 검색어 -->
  <meta name="keywords" content="펫펠리아">                  
  <meta name="robots" content="index, follow">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css">
  <link rel="stylesheet" href="../css/style.css">
</head>
<body>
  <div class="swiper product-swiper">
    <div class="swiper-wrapper">
      <div class="swiper-slide"><img src="../img/01/1.png" alt=""></div>
      <div class="swiper-slide"><img src="../img/01/2.png" alt=""></div>
      <div class="swiper-slide"><img src="../img/01/3.png" alt=""></div>
      <div class="swiper-slide"><img src="../img/01/4.png" alt=""></div>
      <div class="swiper-slide"><img src="../img/01/5.png" alt=""></div>
      <div class="swiper-slide"><img src="../img/01/6.png" alt=""></div>
      <div class="swiper-slide"><img src="../img/01/7.png" alt=""></div>
      <div class="swiper-slide"><img src="../img/01/8.png" alt=""></div>
    </div>
    <div class="swiper-pagination"></div>
    <div class="swiper-button-prev"></div>
    <div class="swiper-button-next"></div>
  </div>

  <br><br><br><br>

  <div class="container">
    <!-- 영상 -->
    <video src="../video/01/응고력 유튜브.mp4" width="100%" controls autoplay></video>
    <video src="../video/01/탈취성능 유튜브.mp4" width="100%" controls autoplay muted></video>
    <video src="../video/01/저분진 유튜브.mp4" width="100%" controls autoplay muted></video>
    <video src="../video/01/발에덜 유튜브.mp4" width="100%" controls autoplay muted></video>
    <!-- 메인 -->
    <img src="../img/01/메인제품소개.png" alt="">
    <!-- 핵심 성능 GIF -->
    <img src="../img/01/응고력.png" alt="">
    <img src="../img/01/모래-응고력.gif" alt="">
    <img src="../img/01/응고력2.png" alt="">
    <img src="../img/01/저분진.png" alt="">
    <img src="../img/01/모래-저분진.gif" alt="">
    <img src="../img/01/저분진2.png" alt="">
    <img src="../img/01/흩어짐.png" alt="">
    <img src="../img/01/모래-흩어짐.gif" alt="">
    <img src="../img/01/흩어짐2.png" alt="">
    <img src="../img/01/탈취력.png" alt="">
    <img src="../img/01/모래-탈취력.gif" alt="">
    <img src="../img/01/탈취력2.png" alt="">
    <!-- 시험결과 및 시험성적서 -->
    <img src="../img/01/시험결과 및 시험성적서.png" alt="">
    <!-- 핵심 특징 요약 -->
    <img src="../img/01/핵심 특징 요약1.png" alt="">
    <img src="../img/01/장점-응고력.gif" alt="">
    <img src="../img/01/핵심 특징 요약2.png" alt="">
    <!-- 원료 및 제품 설계 설명 -->
    <img src="../img/01/원료 및 제품 설계 설명.png" alt="">
    <!-- 이벤트 -->
    <img src="../img/01/오픈이벤트.png" alt="">
    <!-- 하단 -->
    <img src="../img/01/사용방법.png" alt="">
    <img src="../img/01/제품정보 및 Q&A.png" alt="">
    <img src="../img/01/정책.png" alt="">

  </div>

  <script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>
  <script>
    new Swiper('.product-swiper', {
      loop: true,
      pagination: { el: '.swiper-pagination', clickable: true },
      navigation: { nextEl: '.swiper-button-next', prevEl: '.swiper-button-prev' },
    });
  </script>
</body>
</html>
