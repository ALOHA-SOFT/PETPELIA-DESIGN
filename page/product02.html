<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MSP-05</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css">
  <link rel="stylesheet" href="../css/style.css">
</head>
<body>
  <div class="swiper product-swiper">
    <div class="swiper-wrapper">
      <div class="swiper-slide"><img src="../img/02/1.png" alt=""></div>
      <div class="swiper-slide"><img src="../img/02/2.png" alt=""></div>
      <div class="swiper-slide"><img src="../img/02/3.png" alt=""></div>
      <div class="swiper-slide"><img src="../img/02/4.png" alt=""></div>
      <div class="swiper-slide"><img src="../img/02/5.png" alt=""></div>
      <div class="swiper-slide"><img src="../img/02/6.png" alt=""></div>
      <div class="swiper-slide"><img src="../img/02/7.png" alt=""></div>
    </div>
    <div class="swiper-pagination"></div>
    <div class="swiper-button-prev"></div>
    <div class="swiper-button-next"></div>
  </div>

  <br><br><br><br>

  <div class="container">
    <img src="../img/02/오픈이벤트.png" alt="">
    <img src="../img/02/섹션01.png" alt="">
    <img src="../img/02/자동분리.png" alt="">
    <img src="../img/02/MSP-05 자동분리.gif" alt="">
    <img src="../img/02/자동분리2.png" alt="">
    <img src="../img/02/안전탈취.png" alt="">
    <img src="../img/02/MSP-05 안전탈취.gif" alt="">
    <img src="../img/02/안전탈취2.png" alt="">
    <img src="../img/02/스마트앱.png" alt="">
    <img src="../img/02/MSP-05 스마트앱.gif" alt="">

    <img src="../img/02/원터치.png" alt="">
    <img src="../img/02/MSP-05 원터치.gif" alt="">
    <img src="../img/02/원터치2.png" alt="">
    <img src="../img/02/섹션02.png" alt="">
    <img src="../img/02/섹션03.png" alt="">

  </div>

  <script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>
  <script>
    new Swiper('.product-swiper', {
      loop: true,
      pagination: { el: '.swiper-pagination', clickable: true },
      navigation: { nextEl: '.swiper-button-next', prevEl: '.swiper-button-prev' },
    });
  </script>
