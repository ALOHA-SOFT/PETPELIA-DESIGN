  <!-- 웹 페이지 타입 (웹사이트, 기사, 제품 등) -->
  <meta property="og:type" content="website">         
  <!-- 검색어 -->
  <meta name="keywords" content="펫펠리아">                  
  <meta name="robots" content="index, follow">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css">
  <link rel="stylesheet" href="../css/style.css">
</head>
<body>
  <div class="swiper product-swiper">
    <div class="swiper-wrapper">

    <img src="../img/03/안전감지2.png" alt="">
    <img src="../img/03/원터치.png" alt="">
    <img src="../img/03/CKSW-02 원터치.gif" alt="">
    <img src="../img/03/원터치2.png" alt="">
    <img src="../img/03/스마트앱.png" alt="">

  <script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>
  <script>
    new Swiper('.product-swiper', {
      loop: true,
      pagination: { el: '.swiper-pagination', clickable: true },
      navigation: { nextEl: '.swiper-button-next', prevEl: '.swiper-button-prev' },
    });

    // id="auto"인 강제 플레이
    const autoVideo = document.getElementById('auto');
    if (autoVideo) {
      autoVideo.play();
    }
  </script>

</html>
