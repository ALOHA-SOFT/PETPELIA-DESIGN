<style>
  * { margin: 0; padding: 0; box-sizing: border-box;}

body {
  font-family: "Malgun Gothic", "Apple SD Gothic Neo", sans-serif;
}

.container {
  width: 100%;
  max-width: 848px !important;
  margin: 0 auto;
  text-align: center;
}

.container.fix-848 img {
  width: 848px !important;
}

img { 
  width: 100%;
  max-width: 848px;
}

video {
  display: block;
  width: 100%;
  max-width: 100%;
}

.header {
  padding: 40px 0;
  text-align: center;
}

.header img {
  width: 260px;
}

.product-list {
  display: flex;
  justify-content: space-between;
  gap: 24px;
  padding: 40px 0 80px;
}

.product-card {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 24px;
  border: 1px solid #e5e5e5;
  border-radius: 12px;
  text-align: center;
}

.product-card img {
  width: 100%;
  height: 220px;
  object-fit: contain;
  margin-bottom: 16px;
}

.product-name {
  font-size: 18px;
  font-weight: 700;
  color: #222;
  margin-bottom: 20px;
}

.product-btn {
  display: inline-block;
  width: 100%;
  padding: 12px 0;
  background-color: #222;
  color: #fff;
  text-decoration: none;
  font-size: 14px;
  font-weight: 600;
  border-radius: 6px;
  transition: background-color 0.2s ease;
}

.product-btn:hover {
  background-color: #555;
}

.guide-link {
  padding: 0 0 80px;
  text-align: center;
}

.guide-btn {
  display: inline-block;
  padding: 14px 32px;
  border: 1px solid #222;
  border-radius: 6px;
  background-color: #fff;
  color: #222;
  text-decoration: none;
  font-size: 15px;
  font-weight: 700;
  transition: background-color 0.2s ease, color 0.2s ease;
}

.guide-btn:hover {
  background-color: #222;
  color: #fff;
}

.product-swiper {
  width: 100%;
  max-width: 848px;
  margin: 0 auto;
}

.product-swiper .swiper-slide img {
  width: 100%;
  display: block;
}

.product-swiper .swiper-button-prev,
.product-swiper .swiper-button-next {
  color: #222;
  width: 32px;
  height: 32px;
}

.product-swiper .swiper-button-prev::after,
.product-swiper .swiper-button-next::after {
  font-size: 20px;
}

.product-swiper .swiper-pagination-bullet-active {
  background-color: #222;
}

@media (max-width: 600px) {
  .product-swiper .swiper-button-prev,
  .product-swiper .swiper-button-next {
    width: 24px;
    height: 24px;
  }

  .product-swiper .swiper-button-prev::after,
  .product-swiper .swiper-button-next::after {
    font-size: 14px;
  }

  .product-list {
    flex-direction: column;
    padding: 24px 16px 48px;
  }

  .guide-link {
    padding: 0 16px 48px;
  }
}
</style>
